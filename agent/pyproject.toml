[project]
name = "polyagent"
version = "0.1.0"
description = "Hands-free Polymarket paper/live trading agent using official public APIs"
requires-python = ">=3.11"
dependencies = [
  "polymarket-client>=0.9.0,<0.10",
  "eth-account>=0.13",
  "python-dotenv>=1.0",
  "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polyagent"]

[tool.uv]
package = true
